name: Sync Summer cards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild cards.json from the card memory webhook
        run: python3 tools/cards_sync.py
      - name: Commit when it changed
        run: |
          if git diff --quiet -- cards.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.json
          git commit -m "cards.json: new cards from the webhook"
          git push
